<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chicken Server — вход через Google</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#7cc200;font-family:Arial,sans-serif}
  .box{background:#cde4a0;border-radius:14px;padding:28px;max-width:360px;width:86%;text-align:center;
       box-shadow:0 4px 0 #6a9a1a}
  h1{margin:0 0 14px;font-size:26px;color:#1a1a1a}
  p{color:#2a3a12;font-size:17px}
  button{background:#fff;border:0;border-radius:10px;padding:14px 18px;font-size:18px;font-weight:bold;
         cursor:pointer;width:100%;box-shadow:0 3px 0 #9ab36b}
</style>
</head>
<body>
<div class="box">
  <h1>Chicken Server</h1>
  <p id="msg">Загрузка…</p>
  <button id="btn" style="display:none">Войти через Google</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://bvmvxxzoqvjrrmiklzgr.supabase.co";
const SUPABASE_KEY = "sb_publishable_CloHrmn9eMKNEd7EpY7zOQ_vhXAyBpU";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const msg = document.getElementById("msg"), btn = document.getElementById("btn");
const code = new URLSearchParams(location.search).get("c");

async function main() {
  if (!code || code.length < 16) { msg.textContent = "Открой эту страницу из игры."; return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    msg.textContent = "Нажми кнопку, чтобы войти.";
    btn.style.display = "block";
    btn.onclick = () => sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: location.origin + location.pathname + "?c=" + code }
    });
    return;
  }
  msg.textContent = "Завершаю вход…";
  const { data, error } = await sb.rpc("google_complete", { p_code: code });
  if (error || data !== "ok") { msg.textContent = "Ошибка входа. Попробуй ещё раз."; return; }
  msg.textContent = "Готово! Вернись в игру.";
}
main();
</script>
</body>
</html>
